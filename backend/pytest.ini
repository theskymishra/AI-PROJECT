[pytest]
testpaths = app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# -W error promotes warnings to failures. A warning nobody fixes is a warning
# everybody learns to ignore, and that is how a real one gets missed.
#
# --timeout guards against the failure mode that cost a session: an infinite
# SSE generator hanging the suite instead of failing it. A hung CI job is
# worse than a red one.
addopts = -q --strict-markers -W error --timeout=60 --timeout-method=thread
